<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Wishlist — STRYDE</title>
<link rel="stylesheet" href="shared.css"/>
<style>
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px;padding:40px 48px 100px;}
.wl-empty{text-align:center;padding:120px 48px;color:var(--muted);}
.wl-empty-icon{font-size:5rem;margin-bottom:20px;}
.wl-empty h2{font-family:var(--font-d);font-size:3rem;margin-bottom:16px;color:var(--text);}
.wl-remove{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:36px;height:36px;font-size:.8rem;border-radius:50%;transition:all .2s;z-index:10;}
.wl-remove:hover{background:var(--accent2);border-color:var(--accent2);}
@media(max-width:900px){.wl-grid{padding:20px 20px 60px;}}
</style>
</head>
<body>
<div class="cursor" id="cur"></div>
<div class="cursor-ring" id="curR"></div>
<div class="cart-mask" id="cmask" onclick="closeCart()"></div>
<div class="cart-drawer" id="cdrawer">
  <div class="cd-head"><span class="cd-title">Cart (<span id="cdCount">0</span>)</span><button class="cd-close" onclick="closeCart()">✕</button></div>
  <div class="cd-items" id="cdItems"></div>
  <div class="cd-foot" id="cdFoot" style="display:none">
    <div class="cd-total-row"><span class="cd-total-label">Total</span><span class="cd-total-val" id="cdTotal">$0</span></div>
    <button class="cd-checkout" onclick="location.href='checkout.html'">Checkout →</button>
    <button class="cd-continue" onclick="closeCart()">Continue Shopping</button>
  </div>
</div>

<nav class="g-nav">
  <a href="index.html" class="g-nav-logo">STRY<span>D</span>E</a>
  <ul class="g-nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="wishlist.html" class="active">Wishlist</a></li>
  </ul>
  <div class="g-nav-right">
    <button class="g-nav-icon" onclick="location.href='wishlist.html'" style="color:var(--accent)">♡</button>
    <button class="g-nav-icon" onclick="openCart()" style="position:relative">🛒<span class="cart-badge" id="cb1">0</span></button>
    <button class="g-nav-cta" onclick="location.href='shop.html'">Shop Now</button>
  </div>
</nav>

<div class="page-hero">
  <p class="page-hero-label">Saved Items</p>
  <h1 class="page-hero-title" id="wlTitle">YOUR<br>WISHLIST</h1>
</div>

<div id="wlContent"></div>

<footer class="g-footer">
  <div class="g-footer-top">
    <div><a href="index.html" class="g-footer-logo">STRY<span>D</span>E</a><p class="g-footer-tagline">Built for those who move with purpose.</p></div>
    <div><p class="g-fcol-title">Shop</p><ul class="g-fcol-links"><li><a href="shop.html">All Products</a></li><li><a href="shop.html?sale=1">Sale</a></li></ul></div>
    <div><p class="g-fcol-title">Help</p><ul class="g-fcol-links"><li><a href="#">Size Guide</a></li><li><a href="#">Returns</a></li></ul></div>
    <div><p class="g-fcol-title">Company</p><ul class="g-fcol-links"><li><a href="#">About</a></li></ul></div>
  </div>
  <div class="g-footer-bottom"><p class="g-copy">© 2026 STRYDE.</p></div>
</footer>

<script src="shared.js"></script>
<script>
function renderWishlist(){
  const ids = STORE.wishlist;
  const container = document.getElementById('wlContent');
  document.getElementById('wlTitle').innerHTML = `YOUR<br>WISHLIST <span style="font-size:2rem;color:var(--muted)">(${ids.length})</span>`;
  if(!ids.length){
    container.innerHTML = `<div class="wl-empty"><div class="wl-empty-icon">♡</div><h2>Nothing saved yet</h2><p>Browse our collection and save your favourites.</p><br><a href="shop.html" class="btn-primary" style="margin-top:24px;">Browse All Shoes</a></div>`;
    return;
  }
  const products = PRODUCTS.filter(p => ids.includes(p.id));
  container.innerHTML = `<div class="wl-grid">${products.map(p=>`
    <div class="p-card reveal">
      <div class="p-img-wrap"><div class="p-img">${p.emoji}</div></div>
      ${p.tag?`<span class="p-tag tag-${p.tag}">${p.tag==='new'?'New':p.tag==='hot'?'🔥 Hot':'Sale'}</span>`:''}
      <button class="wl-remove" onclick="removeWish(${p.id})">✕</button>
      <div class="p-overlay">
        <a href="product.html?id=${p.id}" style="font-family:var(--font-c);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;padding:12px 26px;background:var(--accent);color:#000;font-weight:700;">View Product</a>
      </div>
      <div class="p-info">
        <p class="p-cat">${p.category}</p>
        <p class="p-name"><a href="product.html?id=${p.id}" style="color:inherit;">${p.name}</a></p>
        <div class="p-footer">
          <div class="p-price">${p.oldPrice?`<span class="p-old">$${p.oldPrice}</span>`:''} $${p.price}</div>
          <div class="p-dots">${p.colors.map(c=>`<div class="p-dot" style="background:${c}"></div>`).join('')}</div>
        </div>
      </div>
    </div>`).join('')}</div>`;
  document.querySelectorAll('.reveal').forEach(el=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){e.target.classList.add('visible');obs.disconnect();}},{threshold:.05});
    obs.observe(el);
  });
}

function removeWish(id){
  STORE.toggleWishlist(id);
  showToast('Removed from wishlist');
  renderWishlist();
}

function openCart(){ document.getElementById('cdrawer').classList.add('open'); document.getElementById('cmask').classList.add('open'); renderCart(); }
function closeCart(){ document.getElementById('cdrawer').classList.remove('open'); document.getElementById('cmask').classList.remove('open'); }
function renderCart(){
  const items=STORE.cart,el=document.getElementById('cdItems'),foot=document.getElementById('cdFoot');
  document.getElementById('cdCount').textContent=STORE.cartCount();
  document.getElementById('cdTotal').textContent='$'+STORE.cartTotal().toLocaleString();
  updateCartBadge();
  if(!items.length){ el.innerHTML='<div class="cd-empty"><div class="cd-empty-icon">👟</div><p>Cart is empty</p></div>'; foot.style.display='none'; return; }
  foot.style.display='block';
  el.innerHTML=items.map(i=>`<div class="cd-item"><div class="cd-item-img">${i.emoji}</div><div class="cd-item-info"><p class="cd-item-name">${i.name}</p><p class="cd-item-meta">Size: ${i.size}</p><div class="cd-item-row"><span class="cd-item-price">$${i.price*i.qty}</span><div class="cd-qty"><button onclick="qtyChange('${i.key}',-1)">−</button><span>${i.qty}</span><button onclick="qtyChange('${i.key}',1)">+</button></div></div><button class="cd-remove" onclick="removeItem('${i.key}')">Remove</button></div></div>`).join('');
}
function qtyChange(k,d){ STORE.updateQty(k,d); renderCart(); }
function removeItem(k){ STORE.removeFromCart(k); renderCart(); }

const cur=document.getElementById('cur'),curR=document.getElementById('curR');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function loop(){cur.style.left=mx+'px';cur.style.top=my+'px';rx+=(mx-rx)*.12;ry+=(my-ry)*.12;curR.style.left=rx+'px';curR.style.top=ry+'px';requestAnimationFrame(loop);})();
document.addEventListener('mouseover',e=>{if(e.target.matches('a,button,.p-card'))curR.classList.add('hov');else curR.classList.remove('hov');});

renderWishlist();
updateCartBadge();
</script>
</body>
</html>
